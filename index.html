<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Essential for mobile PWA rendering -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PagaDios</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Header -->
    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h1 style="font-size: 1.25rem;">PagaDios</h1>
        <button class="menu-btn notif-btn" onclick="switchView('notificaciones')">
            🔔<span id="notif-badge" class="badge hidden">0</span>
        </button>
    </header>

    <!-- Foldable Sidebar -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav class="sidebar">
        <a href="#" class="nav-link" onclick="switchView('add-expense')">Nuevo Gasto</a>
        <a href="#" class="nav-link" onclick="switchView('history')">Historial</a>
        <a href="#" class="nav-link" onclick="switchView('participants')">Participantes</a>
        <a href="#" class="nav-link" onclick="switchView('balance')">Balance</a>
        <a href="#" class="nav-link" onclick="switchView('leaderboards')">Leaderboards</a>
        <a href="#" class="nav-link" onclick="switchView('notificaciones')">Notificaciones</a>
        <a href="#" class="nav-link" onclick="switchView('sesiones')">Sesiones</a>
        <a href="#" class="nav-link" id="nav-logout" onclick="logout()">Salir</a>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- View 0: Mock login -->
        <section id="auth" class="view-section active">
            <div class="card">
                <label>Datos mock (sin Firebase)</label>
                <p class="item-meta" style="margin-bottom: 1rem;">
                    Elegí con qué usuario entrar. Los datos viven en memoria: podés
                    cambiar de usuario con "Salir" para ver la deuda y las
                    notificaciones desde cada lado.
                </p>
                <div id="lista-usuarios-mock"></div>
            </div>
        </section>

        <!-- View 1: Add Expense (Default) -->
        <section id="add-expense" class="view-section">
            <div class="card">
                <div class="form-group">
                    <label>¿Qué compraste?</label>
                    <input type="text" id="gasto-desc" placeholder="Ej: Asado, Nafta, Supermercado">
                </div>
                <div class="form-group">
                    <label>¿Cuánto gastaste?</label>
                    <input type="number" id="gasto-monto" inputmode="decimal" placeholder="$ 0.00">
                </div>
                <button class="btn" id="btn-enviar-gasto">Enviar Gasto</button>
            </div>

            <div class="progress-container card">
                <label>Proporción de gastos totales</label>
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </section>

        <!-- View 2: History -->
        <section id="history" class="view-section">
            <div class="card">
                <div class="form-group">
                    <label>Filtrar por participante</label>
                    <select id="filtro-participante"></select>
                </div>
                <div id="lista-compras"></div>
                <button class="btn btn-outline" id="btn-cargar-mas" style="margin-top: 1rem;">Cargar más</button>
            </div>
        </section>

        <!-- View 3: Participants -->
        <section id="participants" class="view-section">
            <div class="card">
                <div id="lista-participantes"></div>
                <button class="btn btn-outline" id="btn-invitar" style="margin-top: 1rem;">+ Invitar persona (copiar código)</button>
            </div>
        </section>

        <!-- View 4: Balance -->
        <section id="balance" class="view-section">
            <div id="balance-pendientes"></div>
            <div id="lista-balance"></div>
        </section>

        <!-- View 5: Leaderboards -->
        <section id="leaderboards" class="view-section">
            <div id="lista-leaderboards"></div>
        </section>

        <!-- View 5b: Notifications -->
        <section id="notificaciones" class="view-section">
            <div class="card">
                <div class="action-row" style="justify-content: space-between; align-items: center;">
                    <label style="margin: 0;">Notificaciones</label>
                    <button class="btn btn-outline" id="btn-leer-todas" style="width:auto; padding: 0.4rem 0.75rem; font-size: 0.8rem;">Marcar todas leídas</button>
                </div>
                <div id="lista-notificaciones"></div>
            </div>
        </section>

        <!-- View 6: Sessions -->
        <section id="sesiones" class="view-section">
            <div class="card">
                <label>Mis sesiones</label>
                <div id="lista-sesiones"></div>
            </div>
            <div class="card">
                <div class="form-group">
                    <label>Unirme con un código</label>
                    <input type="text" id="input-codigo" placeholder="Ej: FAMILIA-2026">
                </div>
                <button class="btn" id="btn-unirse">Unirme</button>
            </div>
            <div class="card">
                <div class="form-group">
                    <label>Crear una sesión nueva</label>
                    <input type="text" id="input-nueva-sesion" placeholder="Ej: Viaje a la costa">
                </div>
                <button class="btn btn-outline" id="btn-crear-sesion">Crear sesión</button>
            </div>
            <div class="card">
                <button class="btn btn-outline" id="btn-reiniciar">Reiniciar datos demo</button>
            </div>
        </section>

    </main>

    <!-- UI Logic: View routing and Sidebar toggle -->
    <script>
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const views = document.querySelectorAll('.view-section');

        // Toggles off-canvas menu state
        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // Handles SPA internal routing
        function switchView(viewId) {
            views.forEach(view => view.classList.remove('active'));
            const target = document.getElementById(viewId);
            if (target) target.classList.add('active');
            closeSidebar();
        }

        // Punto de salida que completa app.js
        function logout() {
            if (window.pagadiosLogout) window.pagadiosLogout();
        }
    </script>
    
    <script type="module" src="./app.js"></script>
</body>
</html>
